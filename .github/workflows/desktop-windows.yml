name: Program Windows (.exe)

on:
  push:
    branches: [main, desktop-windows]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalare dependențe
        run: npm ci

      - name: Teste
        run: npm test

      - name: Construiește installer-ul
        run: npm run desktop:dist

      - name: Salvează installer-ul
        uses: actions/upload-artifact@v4
        with:
          name: twopixeldev-CRM-Windows
          path: dist-desktop/installer/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publică versiunea (doar pentru tag-uri v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-desktop/installer/*.exe
          generate_release_notes: true
