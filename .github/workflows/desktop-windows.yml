name: Program Windows (.exe)

on:
  push:
    branches: [main, desktop-windows]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalare dependențe
        run: npm ci

      - name: Teste
        run: npm test

      # Publică installer-ul + latest.yml în GitHub Releases, ca versiunea „v<version din package.json>”.
      # Programul instalat își ia de acolo singur actualizările. Dacă versiunea există deja,
      # electron-builder nu o suprascrie: o versiune nouă cere creșterea „version” în package.json.
      - name: Construiește și publică versiunea
        run: npm run desktop:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvează installer-ul
        uses: actions/upload-artifact@v4
        with:
          name: twopixeldev-CRM-Windows
          path: dist-desktop/installer/*.exe
          if-no-files-found: error
          retention-days: 30
