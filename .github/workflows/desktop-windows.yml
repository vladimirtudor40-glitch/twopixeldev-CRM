name: Program Windows (.exe)

on:
  push:
    branches: [main, desktop-windows]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalare dependențe
        run: npm ci

      - name: Teste
        run: npm test

      - name: Construiește installer-ul
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run desktop:dist

      # Pe tag-uri v*: publică în GitHub Releases installer-ul + latest.yml, de unde programul instalat
      # își ia singur actualizările
      - name: Construiește și publică versiunea (actualizare automată)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run desktop:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvează installer-ul
        uses: actions/upload-artifact@v4
        with:
          name: twopixeldev-CRM-Windows
          path: dist-desktop/installer/*.exe
          if-no-files-found: error
          retention-days: 30
