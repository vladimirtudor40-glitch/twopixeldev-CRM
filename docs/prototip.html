<title>twopixeldev CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar de aplicație + zonă de lucru; pe telefon bara laterală devine navigație jos.
   Un singur aspect, intenționat întunecat: paleta twopixeldev. */
:root{
  --navy:#0A1828;          /* albastru închis clasic, fundal */
  --surface:#0F2236;
  --surface-2:#14304A;
  --line:#1F3B57;
  --text:#E8EEF3;
  --muted:#8EA2B6;
  --teal:#178582;          /* turcoaz: acțiuni, stări active */
  --teal-hi:#25A7A2;
  --gold:#BFA181;          /* auriu: accente, câștig, MRR */
  --gold-hi:#D7BE98;
  --danger:#D5675E;
  --warn:#D9A441;
  --ok:#43B48C;
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--navy);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal-hi)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:800}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:700}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* Shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:20px;padding:20px 14px 16px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:linear-gradient(180deg,#0C1D30, var(--navy))}
.brand img{width:170px;display:block}
.brand small{display:block;margin-top:6px;color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;color:var(--muted);text-align:left;font-weight:500}
.nav button:hover{background:var(--surface);color:var(--text)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"] svg{color:var(--gold)}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--danger);color:#fff;border-radius:10px;padding:1px 7px}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:14px;border-top:1px solid var(--line);font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff;font-weight:700;font-size:12px;flex:none}
.avatar.gold{background:var(--gold);color:var(--navy)}
main{min-width:0;padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar .sp{flex:1}
.demo-pill{font-size:11px;color:var(--gold);border:1px solid #BFA18155;border-radius:20px;padding:3px 10px;letter-spacing:.04em}
.mob-top{display:none}
.bottomnav{display:none}

/* Generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-hi)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.ghost{background:none}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.input,.select{background:var(--navy);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.input:focus,.select:focus{border-color:var(--teal);outline:none}
textarea.input{width:100%;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;border-radius:20px;padding:4px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:#17858222;border-color:var(--teal);color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.prio{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-weight:800;font-family:var(--f-display);font-size:12px}
.prio.A{background:var(--gold);color:var(--navy)}
.prio.B{background:#BFA18133;color:var(--gold-hi)}
.prio.C{background:var(--surface-2);color:var(--muted)}
.web{font-size:11px;padding:2px 7px;border-radius:5px;white-space:nowrap}
.web.FARA_SITE{background:#43B48C22;color:#7FD8B4}
.web.DOAR_PLATFORME{background:#43B48C22;color:#7FD8B4}
.web.ARE_SITE_PROPRIU{background:var(--surface-2);color:var(--muted)}
.web.NECUNOSCUT{background:#D9A44122;color:var(--warn)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.dnc{background:#D5675E1f;border:1px solid #D5675E66;color:#F2A49D;border-radius:8px;padding:8px 10px;font-size:13px}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:800;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.mrr{border-color:#BFA18166;background:linear-gradient(135deg,#BFA18118,var(--surface) 60%)}
.kpi.mrr .v{color:var(--gold-hi)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}
.funnel{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.frow{display:grid;grid-template-columns:118px minmax(0,1fr) 64px;align-items:center;gap:10px;font-size:13px}
.fbar{height:20px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.fbar i{display:block;height:100%;border-radius:5px}
.tasklist{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input{margin-top:3px;accent-color:var(--teal);width:16px;height:16px}
.task .t{font-weight:600}
.task .l{font-size:12px;color:var(--muted)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.due{font-size:12px;white-space:nowrap}
.due.late{color:var(--danger);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.zones{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.zrow{display:grid;grid-template-columns:130px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.zbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
svg text{fill:var(--muted);font-family:var(--f-body)}

/* Lead table */
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.searchbox{position:relative;flex:1;min-width:220px}
.searchbox input{width:100%;padding-left:34px}
.searchbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.fgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fgroup .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;width:78px;flex:none}
.views{display:flex;gap:6px;flex-wrap:wrap}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:#0D1F33;position:sticky;top:0;white-space:nowrap}
th button{background:none;border:0;padding:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#14304A88}
td .nm{font-weight:600}
td .sub{font-size:12px;color:var(--muted)}
.cards{display:none}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.count{font-size:13px;color:var(--muted);margin:0 0 8px}

/* Drawer */
.scrim{position:fixed;inset:0;background:#02080Fb3;z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--navy);border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.dbody{overflow-y:auto;padding:16px 20px 30px;flex:1}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick a,.quick button{justify-content:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -20px 16px;padding:0 20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--gold)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.tl::before{content:"";position:absolute;left:14px;top:28px;bottom:0;width:1px;background:var(--line)}
.tl:last-child::before{display:none}
.tl .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--teal-hi)}
.tl .ic.stage{color:var(--gold)}
.tl .when{font-size:12px;color:var(--muted)}
.tl .out{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);margin-left:6px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.contact{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.calc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.calc .res{grid-column:1/-1;border:1px solid #BFA18155;border-radius:10px;padding:14px;background:linear-gradient(135deg,#BFA18114,transparent)}
.big{font-family:var(--f-display);font-size:26px;font-weight:800;color:var(--gold-hi)}
.cmp{display:grid;grid-template-columns:120px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:12px;margin-top:6px}
.cmp .bar{height:14px;border-radius:4px}

/* Kanban */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:0 0 262px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 150px);scroll-snap-align:start}
.col.over{border-color:var(--teal);background:#17858214}
.colh{padding:11px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.colh .n{margin-left:auto;font-size:12px;color:var(--muted)}
.colb{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:60px}
.kcard{background:var(--navy);border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.kcard:hover{border-color:#2B5577}
.kcard.dragging{opacity:.4}
.kcard .nm{font-weight:600;cursor:pointer}
.kcard .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.kcard select{font-size:12px;padding:3px 6px}

/* Map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
.map{background:#10263A;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;height:calc(100vh - 140px);min-height:420px}
.map svg{width:100%;height:100%;display:block;overflow:visible}
.mapctl{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.mapnote{position:absolute;bottom:8px;left:10px;right:10px;font-size:11px;color:var(--muted)}
.pin{cursor:pointer}
.mapside{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 140px);overflow-y:auto}

/* Modal */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:70;background:#02080Fb3;padding:16px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--surface-2);border:1px solid var(--teal);padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;max-width:calc(100% - 32px)}

/* Clients */
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.impl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.impl div{font-size:11px;text-align:center;padding:6px 4px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.impl div.GATA{background:#43B48C22;color:#7FD8B4}
.impl div.IN_LUCRU{background:#D9A44122;color:var(--warn)}
.months{display:flex;gap:4px;flex-wrap:wrap}
.months button{font-size:11px;border-radius:5px;padding:3px 6px;border:1px solid var(--line);background:none}
.months button.PLATIT{background:#43B48C22;border-color:#43B48C55;color:#7FD8B4}
.months button.NEPLATIT{background:#D5675E1f;border-color:#D5675E66;color:#F2A49D}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dgrid{grid-template-columns:minmax(0,1fr)}
  .mapwrap{grid-template-columns:minmax(0,1fr)}
  .mapside{max-height:none}
}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-block:12px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mob-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .mob-top img{width:132px}
  .bottomnav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0C1D30;border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bottomnav button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:10px;padding:4px 0}
  .bottomnav button[aria-current="page"]{color:var(--gold)}
  .tablewrap{display:none}
  .cards{display:flex;flex-direction:column;gap:8px}
  .fgroup .lbl{width:100%}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-grid,.calc{grid-template-columns:minmax(0,1fr)}
  .frow{grid-template-columns:92px minmax(0,1fr) 72px}
  .topbar .demo-pill{display:none}
  .zrow{grid-template-columns:100px minmax(0,1fr) 30px}
  .map{height:62vh}
  .col{flex-basis:84%}
  .drawer{border-left:0}
  .dhead,.dbody{padding-left:16px;padding-right:16px}
  .tabs{margin:0 -16px 16px;padding:0 16px}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

function buildLeads(){
  const firstNames=["Mihai","Elena","Ion","Cristina","Radu","Daniela","George","Simona","Florin","Laura","Adrian","Irina"];
  const lastNames=["Popescu","Ionescu","Stan","Dumitru","Marin","Constantin","Neagu","Tudose","Enache","Vasile","Barbu","Petcu"];
  return RAW.map((r,i)=>{
    const [name,type,zone,address,lat,lon,phone,cat,rooms,web,prio,stage,owner,source,rating]=r;
    const id="L"+(i+1);
    const slug=strip(name).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    const si=STAGE[stage].idx;
    const reached = stage==="PIERDUT" ? [2,3,1][i%3] : stage==="REVINO_MAI_TARZIU" ? 3 : si;
    const contacts = phone ? [{id:uid("c"),name:firstNames[i%12]+" "+lastNames[(i*5)%12],role:"PROPRIETAR",phone,email:"",pref:i%3===0?"WHATSAPP":"TELEFON",primary:true}] : [];
    if(phone && i%4===1) contacts.push({id:uid("c"),name:firstNames[(i+3)%12]+" "+lastNames[(i+7)%12],role:i%2?"ADMINISTRATOR":"RECEPTIE",phone:phone.replace(/\d$/,"9"),email:"",pref:"TELEFON",primary:false});
    // istoric etape
    const history=[{id:uid("h"),from:null,to:"NOU",at:at(-40+i%6,9),by:"Import Excel"}];
    let t=-34+(i%5);
    const path = LINEAR.slice(1, Math.min(reached,6)+1);
    if(reached>=7) path.push("NEGOCIERE","CASTIGAT");
    else if(reached===6) path.push("NEGOCIERE");
    let prev="NOU";
    for(const s of path){ if(s==="NOU")continue; t+=3+(i%3); history.push({id:uid("h"),from:prev,to:s,at:at(Math.min(t,-1),11),by:USERS[owner]}); prev=s; }
    if(stage==="PIERDUT"||stage==="REVINO_MAI_TARZIU"){ history.push({id:uid("h"),from:prev,to:stage,at:at(-2,15),by:USERS[owner]}); }
    // interacțiuni
    const inter=[];
    if(si>=2 || stage==="PIERDUT" || stage==="REVINO_MAI_TARZIU"){
      inter.push({id:uid("i"),type:"APEL",outcome:"FARA_RASPUNS",at:at(-26+(i%4),10,15),by:USERS[owner],notes:"Nu a răspuns, am lăsat SMS cu numele firmei."});
      inter.push({id:uid("i"),type:i%2?"WHATSAPP":"APEL",outcome:"DISCUTIE_POZITIVA",at:at(-21+(i%4),12),by:USERS[owner],notes:"Lucrează doar cu Booking, plătesc 15% comision. Proprietarul e deschis să vadă o prezentare."});
    }
    if(si>=4 && si<=7) inter.push({id:uid("i"),type:"VIZITA",outcome:"DEMO_STABILIT",at:at(-12+(i%3),16),by:USERS[owner],notes:"Am trecut pe la recepție. Demo stabilit cu proprietarul, vrea să vadă motorul de rezervări pe telefon."});
    if(si>=5 && si<=7) inter.push({id:uid("i"),type:"DEMO",outcome:"CERE_OFERTA",at:at(-8+(i%3),11),by:USERS[owner],notes:"Demo pe cifrele lor: ~"+(rooms*9000).toLocaleString("ro-RO")+" lei/an. I-a plăcut cardul cu economii și plata cu card de vacanță."});
    if(si>=6 && si<=7) inter.push({id:uid("i"),type:"EMAIL",outcome:"DISCUTIE_NEUTRA",at:at(-4,9,30),by:USERS[owner],notes:"Oferta trimisă pe email. Întreabă dacă setup-ul se poate plăti în două tranșe."});
    if(stage==="PIERDUT") inter.push({id:uid("i"),type:"APEL",outcome:"REFUZ",at:at(-2,15),by:USERS[owner],notes:"Au deja site cu motor de rezervări de la altă firmă, contract pe încă 2 ani."});
    if(stage==="REVINO_MAI_TARZIU") inter.push({id:uid("i"),type:"APEL",outcome:"CERE_REVENIRE",at:at(-2,15),by:USERS[owner],notes:"Acum nu au timp, se ocupă de renovare. Să revenim în martie, înainte de sezon."});
    // sarcini
    const tasks=[];
    const tk=(title,days,type)=>tasks.push({id:uid("t"),title,due:at(days,10),type,done:false,assignee:owner});
    if(stage==="NOU" && prio==="A") tk("Primul apel: prezentare scurtă",(i%3)-1,"APEL");
    if(stage==="DE_VERIFICAT") tk("Verifică pe Google Maps dacă are site și telefon",i%2?0:-2,"VERIFICARE");
    if(stage==="CONTACTAT") tk("Sună din nou, după-amiaza",i%2?0:-1,"APEL");
    if(stage==="INTERESAT") tk("Stabilește data pentru demo",i%2?1:0,"APEL");
    if(stage==="DEMO_PROGRAMAT") tk("Demo la fața locului (laptop + calcul economii)",i%2?0:2,"DEMO");
    if(stage==="OFERTA_TRIMISA") tk("Revino la ofertă",i%2?-1:1,"APEL");
    if(stage==="NEGOCIERE") tk("Trimite oferta revizuită (setup în 2 tranșe)",0,"TRIMITE_OFERTA");
    if(stage==="REVINO_MAI_TARZIU") tk("Revino înainte de sezon",120,"APEL");
    const ownSite = web==="ARE_SITE_PROPRIU";
    const lead={
      id,name,type,zone,address,lat,lon,phone,email:phone?("rezervari@"+slug.slice(0,18)+".demo"):"",
      category:cat,rooms,web,
      websiteUrl: ownSite?("https://www."+slug+".demo"):"",
      bookingUrl: web!=="FARA_SITE"&&web!=="NECUNOSCUT"?("https://www.booking.com/hotel/ro/"+slug+".html"):"",
      facebookUrl: web==="DOAR_PLATFORME"&&i%2?("https://facebook.com/"+slug.replace(/-/g,"")):"",
      priority:prio,stage,owner,source,rating,
      operator: i%3===0?("SC "+name.split(" ").slice(-1)[0].toUpperCase()+" TURISM SRL"):"",
      cui: i%3===0?"(demo)":"",
      inMinistry: source.includes("minister"),
      tags: [i%5===0?"vizitat pe teren":null, prio==="A"&&web==="FARA_SITE"?"fără site":null, rooms>=30?"mare":null].filter(Boolean),
      contacts, interactions:inter.sort((a,b)=>b.at-a.at), tasks, history,
      lostReason: stage==="PIERDUT"?(ownSite?"ARE_DEJA_SITE":"PRET"):null,
      followUp: stage==="REVINO_MAI_TARZIU"?at(120,10):null,
      revenue: rooms*9000,
      doNotContact: i===16,
      manualCheck: web==="NECUNOSCUT"?"Caută pe Google Maps: are buton „Site web”?":"",
    };
    if(stage==="CASTIGAT"){
      lead.client={plan:i%2?"Standard":"Esențial",setup:i%2?2500:1800,monthly:i%2?250:190,start:at(-30-i,10),domain:slug.split("-").slice(-2).join("")+".ro",tenantSlug:slug.slice(0,20),
        impl:{site:"GATA",motor:i%2?"GATA":"IN_LUCRU",ical:i%2?"IN_LUCRU":"NEINCEPUT",plati:"NEINCEPUT"},
        payments:[{m:-1,status:"PLATIT"},{m:0,status:i%2?"PLATIT":"NEPLATIT"}]};
    }
    return lead;
  });
}

/* ---------------- Aplicația ---------------- */
function App(){
  const [leads,setLeads]=useState(buildLeads);
  const [view,setView]=useState(()=>{const h=location.hash.slice(1);return ["panou","leaduri","pipeline","harta","clienti"].includes(h)?h:"panou";});
  const [openId,setOpenId]=useState(null);
  const [openTab,setOpenTab]=useState("prezentare");
  const [toast,setToast]=useState(null);
  const [stageAsk,setStageAsk]=useState(null);
  const [leadFilter,setLeadFilter]=useState(null);

  useEffect(()=>{const f=()=>{const h=location.hash.slice(1); if(["panou","leaduri","pipeline","harta","clienti"].includes(h)) setView(h);}; addEventListener("hashchange",f); return ()=>removeEventListener("hashchange",f);},[]);
  const go = v => { setView(v); try{history.replaceState(null,"","#"+v);}catch(e){} window.scrollTo(0,0); };
  const say = m => { setToast(m); clearTimeout(say.t); say.t=setTimeout(()=>setToast(null),2600); };
  const upd = (id,fn) => setLeads(ls=>ls.map(l=>l.id===id?fn({...l}):l));
  const open = (id,tab="prezentare") => { setOpenId(id); setOpenTab(tab); };

  const requestMove = (id,to) => {
    const l=leads.find(x=>x.id===id); if(!l||l.stage===to) return;
    if(to==="PIERDUT"||to==="REVINO_MAI_TARZIU"||to==="CASTIGAT") setStageAsk({id,to});
    else doMove(id,to,{});
  };
  const doMove = (id,to,extra) => {
    upd(id,l=>{
      const h={id:uid("h"),from:l.stage,to,at:Date.now(),by:USERS[ME],note:extra.note||""};
      l.history=[...l.history,h]; l.stage=to;
      if(to==="PIERDUT") l.lostReason=extra.lostReason;
      if(to==="REVINO_MAI_TARZIU"){ l.followUp=extra.followUp; l.tasks=[...l.tasks,{id:uid("t"),title:"Revino (programat din pipeline)",due:extra.followUp,type:"APEL",done:false,assignee:l.owner}]; }
      if(to==="CASTIGAT" && !l.client){ l.client={plan:extra.plan||"Standard",setup:+extra.setup||2500,monthly:+extra.monthly||250,start:Date.now(),domain:"",tenantSlug:strip(l.name).replace(/[^a-z0-9]+/g,"-").slice(0,20),impl:{site:"NEINCEPUT",motor:"NEINCEPUT",ical:"NEINCEPUT",plati:"NEINCEPUT"},payments:[{m:0,status:"NEPLATIT"}]}; }
      return l;
    });
    setStageAsk(null);
    say(`Mutat în „${STAGE[to].label}”`);
  };

  const lead = leads.find(l=>l.id===openId);
  const overdue = leads.reduce((n,l)=>n+l.tasks.filter(t=>!t.done && startOfDay(t.due)<T0).length,0);
  const NAV=[["panou","Panou","dash"],["leaduri","Lead-uri","list"],["pipeline","Pipeline","kanban"],["harta","Hartă","map"],["clienti","Clienți","users"]];

  return html`
  <div className="shell">
    <aside className="side">
      <div className="brand"><img src=${LOGO} alt="twopixeldev"/><small>CRM vânzări</small></div>
      <nav className="nav" aria-label="Navigare">
        ${NAV.map(([k,l,ic])=>html`<button key=${k} aria-current=${view===k?"page":undefined} onClick=${()=>go(k)}><${Icon} n=${ic}/>${l}${k==="panou"&&overdue?html`<span className="cnt" title="Sarcini întârziate">${overdue}</span>`:null}</button>`)}
      </nav>
      <div className="nav">
        <button onClick=${()=>say("Importul Excel/CSV vine în Pasul 2")}><${Icon} n="upload"/>Import Excel / CSV</button>
      </div>
      <div className="me"><span className="avatar gold">VT</span><div><div>${USERS[ME]}</div><div className="muted" style=${{fontSize:"11px"}}>ADMIN</div></div></div>
    </aside>
    <main>
      <div className="mob-top"><img src=${LOGO} alt="twopixeldev"/><span className="demo-pill">Prototip · date demo</span></div>
      ${view==="panou"&&html`<${Dashboard} leads=${leads} open=${open} upd=${upd} go=${go} setLeadFilter=${setLeadFilter}/>`}
      ${view==="leaduri"&&html`<${Leads} leads=${leads} open=${open} preset=${leadFilter} clearPreset=${()=>setLeadFilter(null)}/>`}
      ${view==="pipeline"&&html`<${Pipeline} leads=${leads} open=${open} requestMove=${requestMove}/>`}
      ${view==="harta"&&html`<${MapView} leads=${leads} open=${open}/>`}
      ${view==="clienti"&&html`<${Clients} leads=${leads} open=${open} upd=${upd} say=${say}/>`}
    </main>
  </div>
  <nav className="bottomnav" aria-label="Navigare">
    ${NAV.map(([k,l,ic])=>html`<button key=${k} aria-current=${view===k?"page":undefined} onClick=${()=>go(k)}><${Icon} n=${ic} s=${20}/>${l}</button>`)}
    <button onClick=${()=>say("Importul Excel/CSV vine în Pasul 2")}><${Icon} n="upload" s=${20}/>Import</button>
  </nav>
  ${lead&&html`<${LeadDrawer} key=${lead.id} lead=${lead} tab=${openTab} setTab=${setOpenTab} close=${()=>setOpenId(null)} upd=${upd} requestMove=${requestMove} say=${say}/>`}
  ${stageAsk&&html`<${StageDialog} ask=${stageAsk} lead=${leads.find(l=>l.id===stageAsk.id)} cancel=${()=>setStageAsk(null)} confirm=${extra=>doMove(stageAsk.id,stageAsk.to,extra)}/>`}
  ${toast&&html`<div className="toast" role="status">${toast}</div>`}
  `;
}

/* ---------------- Panou (dashboard) ---------------- */
function Dashboard({leads,open,upd,go,setLeadFilter}){
  const active = leads.filter(l=>!["CASTIGAT","PIERDUT"].includes(l.stage));
  const aNotCalled = leads.filter(l=>l.priority==="A" && ["NOU","DE_VERIFICAT"].includes(l.stage) && !l.doNotContact).length;
  const weekAgo=T0-6*DAY;
  const allInter = leads.flatMap(l=>l.interactions);
  const weekInter = allInter.filter(i=>i.at>=weekAgo);
  const demos = leads.filter(l=>l.stage==="DEMO_PROGRAMAT").length;
  const mrr = leads.filter(l=>l.client).reduce((s,l)=>s+l.client.monthly,0);
  const clients = leads.filter(l=>l.client).length;
  // funnel: câte lead-uri au atins fiecare etapă
  const maxReached = l => Math.max(...l.history.map(h=>LINEAR.indexOf(h.to)).filter(x=>x>=0),0);
  const funnel = LINEAR.map((s,i)=>({s,n:leads.filter(l=>maxReached(l)>=i).length}));
  // zone x prioritate
  const zoneRows = Object.keys(ZONES).map(z=>({z,A:0,B:0,C:0,...Object.fromEntries(["A","B","C"].map(p=>[p,leads.filter(l=>l.zone===z&&l.priority===p).length]))}));
  const zmax = Math.max(...zoneRows.map(r=>r.A+r.B+r.C));
  // activitate pe săptămâni (ultimele 8)
  const weeks = Array.from({length:6},(_,k)=>{const end=T0+DAY-(5-k)*7*DAY, start=end-7*DAY;
    const w=allInter.filter(i=>i.at>=start&&i.at<end);
    return {label:fmtDate(start),apel:w.filter(i=>["APEL","WHATSAPP","EMAIL"].includes(i.type)).length,vizita:w.filter(i=>i.type==="VIZITA"||i.type==="DEMO").length,
      oferte:leads.filter(l=>l.history.some(h=>h.to==="OFERTA_TRIMISA"&&h.at>=start&&h.at<end)).length};});
  const tasks = leads.flatMap(l=>l.tasks.filter(t=>!t.done && startOfDay(t.due)<=T0).map(t=>({...t,lead:l}))).sort((a,b)=>a.due-b.due);
  const late = tasks.filter(t=>startOfDay(t.due)<T0), today = tasks.filter(t=>startOfDay(t.due)===T0);
  const toggle = (lid,tid)=>upd(lid,l=>{l.tasks=l.tasks.map(t=>t.id===tid?{...t,done:!t.done}:t);return l;});

  return html`
  <div className="topbar"><div><div className="eyebrow">${new Date().toLocaleDateString("ro-RO",{weekday:"long",day:"numeric",month:"long"})}</div><h1>Bună, Vladimir</h1></div><span className="sp"></span><span className="demo-pill">Prototip · date demo</span></div>
  <div className="kpis">
    <div className="kpi"><div className="eyebrow">Lead-uri în lucru</div><div className="v num">${active.length}</div><div className="s">din ${leads.length} unități în bază</div></div>
    <div className="kpi"><div className="eyebrow">Prioritate A nesunate</div><div className="v num">${aNotCalled}</div><div className="s"><button className="btn sm ghost" style=${{padding:0,border:0,color:"var(--teal-hi)"}} onClick=${()=>{setLeadFilter("deSunat");go("leaduri");}}>Vezi lista →</button></div></div>
    <div className="kpi"><div className="eyebrow">Contacte în ultimele 7 zile</div><div className="v num">${weekInter.length}</div><div className="s">${demos} demo-uri programate</div></div>
    <div className="kpi mrr"><div className="eyebrow">MRR abonamente</div><div className="v num">${lei(mrr)}</div><div className="s">${clients} clienți activi · ${lei(mrr*12)} / an</div></div>
  </div>
  <div className="dgrid">
    <section className="panel" aria-labelledby="h-tasks">
      <div className="row"><h2 id="h-tasks">De făcut azi</h2><span className="sp" style=${{flex:1}}></span><span className="muted num" style=${{fontSize:"12px"}}>${late.length} întârziate · ${today.length} azi</span></div>
      <div className="tasklist" style=${{marginTop:"8px"}}>
        ${tasks.length===0&&html`<p className="muted">Nimic pe azi. Bun moment pentru apeluri noi din prioritatea A.</p>`}
        ${tasks.slice(0,9).map(t=>html`<div key=${t.id} className=${"task"+(t.done?" done":"")}>
          <input type="checkbox" id=${"tk-"+t.id} checked=${t.done} onChange=${()=>toggle(t.lead.id,t.id)} aria-label=${"Bifează: "+t.title}/>
          <div style=${{minWidth:0}}><div className="t">${t.title}</div><button className="l" style=${{background:"none",border:0,padding:0,textAlign:"left"}} onClick=${()=>open(t.lead.id,"sarcini")}>${t.lead.name} · ${ZONES[t.lead.zone]}</button></div>
          <span className=${"due"+(startOfDay(t.due)<T0?" late":"")}>${startOfDay(t.due)<T0?rel(t.due):"azi"}</span>
        </div>`)}
      </div>
    </section>
    <section className="panel" aria-labelledby="h-fun">
      <h2 id="h-fun">Conversie pe etape</h2>
      <p className="muted" style=${{margin:"4px 0 0",fontSize:"12px"}}>Câte unități au ajuns cel puțin până la fiecare etapă.</p>
      <div className="funnel">
        ${funnel.map((f,i)=>html`<div key=${f.s} className="frow"><span>${STAGE[f.s].label.replace(" (client)","")}</span><div className="fbar"><i style=${{width:(f.n/funnel[0].n*100)+"%",background:STAGE[f.s].color}}></i></div><span className="num muted" style=${{textAlign:"right",whiteSpace:"nowrap"}}>${f.n}${i>0?html` · ${Math.round(f.n/funnel[0].n*100)}%`:""}</span></div>`)}
      </div>
    </section>

function ActivityChart({weeks}){
  const W=520,H=190,pl=26,pb=22,pt=10;
  const max=Math.max(4,...weeks.map(w=>w.apel+w.vizita+w.oferte));
  const top=Math.ceil(max/2)*2;
  const bw=(W-pl)/weeks.length;
  const y=v=>H-pb-(v/top)*(H-pb-pt);
  return html`<div style=${{overflowX:"auto"}}><svg viewBox=${`0 0 ${W} ${H}`} style=${{width:"100%",minWidth:"320px",display:"block",marginTop:"8px"}} role="img" aria-label="Activitate pe ultimele 6 săptămâni">
    ${[0,top/2,top].map(v=>html`<g key=${v}><line x1=${pl} x2=${W} y1=${y(v)} y2=${y(v)} stroke="#1F3B57" stroke-width="1"/><text x=${pl-6} y=${y(v)+4} font-size="10" text-anchor="end">${v}</text></g>`)}
    ${weeks.map((w,i)=>{const x=pl+i*bw+bw*.2, wd=bw*.6; let base=0; const seg=[["apel","#178582"],["vizita","#4FD1C5"],["oferte","#BFA181"]];
      return html`<g key=${i}>${seg.map(([k,c])=>{const v=w[k]; if(!v) return null; const r=html`<rect key=${k} x=${x} width=${wd} y=${y(base+v)} height=${y(base)-y(base+v)} fill=${c} rx="2"><title>${v}</title></rect>`; base+=v; return r;})}
      <text x=${x+wd/2} y=${H-6} font-size="10" text-anchor="middle">${w.label}</text></g>`;})}
  </svg></div>`;
}

const SAVED = {
  deSunat:{label:"De sunat (A, necontactate)",f:{prio:["A"],stage:["NOU","DE_VERIFICAT"],hasPhone:true}},
  mamaiaFaraSite:{label:"Mamaia fără site",f:{zone:["MAMAIA","MAMAIA_NORD_NAVODARI"],web:["FARA_SITE","DOAR_PLATFORME"]}},
  aleMele:{label:"Ale mele",f:{mine:true}},
  uitate:{label:"Fără contact de 14+ zile",f:{stale:true}},
};
const EMPTY_F={zone:[],type:[],prio:[],web:[],stage:[],hasPhone:false,mine:false,stale:false};

function Leads({leads,open,preset,clearPreset}){
  const [q,setQ]=useState("");
  const [f,setF]=useState(()=>preset&&SAVED[preset]?{...EMPTY_F,...SAVED[preset].f}:EMPTY_F);
  const [activeView,setActiveView]=useState(preset||null);
  const [sort,setSort]=useState({k:"priority",d:1});
  useEffect(()=>{ if(preset) clearPreset(); },[]);
  const tog=(k,v)=>{setActiveView(null);setF(o=>({...o,[k]:o[k].includes(v)?o[k].filter(x=>x!==v):[...o[k],v]}));};
  const last = l => l.interactions.length?Math.max(...l.interactions.map(i=>i.at)):null;
  const list = useMemo(()=>{
    const nq=strip(q).trim();
    let r=leads.filter(l=>{
      if(nq){const hay=strip([l.name,l.address,l.phone,l.email,l.operator,ZONES[l.zone],...l.contacts.map(c=>c.name)].join(" ")); const hayP=hay.replace(/\s/g,""); if(!nq.split(/\s+/).every(w=>hay.includes(w)||hayP.includes(w.replace(/\s/g,"")))) return false;}
      if(f.zone.length&&!f.zone.includes(l.zone))return false;
      if(f.type.length&&!f.type.includes(l.type))return false;
      if(f.prio.length&&!f.prio.includes(l.priority))return false;
      if(f.web.length&&!f.web.includes(l.web))return false;
      if(f.stage.length&&!f.stage.includes(l.stage))return false;
      if(f.hasPhone&&!l.phone)return false;
      if(f.mine&&l.owner!==ME)return false;
      if(f.stale){const t=last(l); if(["CASTIGAT","PIERDUT","REVINO_MAI_TARZIU"].includes(l.stage)) return false; if(t&&t>T0-14*DAY) return false;}
      return true;});
    const val={name:l=>strip(l.name),zone:l=>ZONES[l.zone],priority:l=>l.priority+strip(l.name),stage:l=>STAGE[l.stage].idx,last:l=>-(last(l)||0),rooms:l=>-(l.rooms||0)};
    return r.sort((a,b)=>{const A=val[sort.k](a),B=val[sort.k](b);return (A>B?1:A<B?-1:0)*sort.d;});
  },[leads,q,f,sort]);
  const Th=({k,children})=>html`<th aria-sort=${sort.k===k?(sort.d>0?"ascending":"descending"):"none"}><button onClick=${()=>setSort(s=>({k,d:s.k===k?-s.d:1}))}>${children}${sort.k===k?(sort.d>0?" ↑":" ↓"):""}</button></th>`;
  const FG=({k,label,opts})=>html`<div className="fgroup" role="group" aria-label=${label}><span className="lbl">${label}</span>${Object.entries(opts).map(([v,l])=>html`<button key=${v} className="chip" aria-pressed=${f[k].includes(v)} onClick=${()=>tog(k,v)}>${l}</button>`)}</div>`;
  const anyF = q||JSON.stringify(f)!==JSON.stringify(EMPTY_F);
  return html`
  <div className="topbar"><h1>Lead-uri</h1><span className="sp"></span><button className="btn"><${Icon} n="upload"/>Import</button><button className="btn primary"><${Icon} n="plus"/>Lead nou</button></div>
  <div className="filters">
    <div className="row">
      <div className="searchbox"><${Icon} n="search"/><input id="q" className="input" placeholder="Caută: nume, adresă, telefon, persoană… (merge și fără diacritice)" value=${q} onInput=${e=>setQ(e.target.value)}/></div>
    </div>
    <div className="views" role="group" aria-label="Vederi salvate"><span className="eyebrow" style=${{alignSelf:"center",marginRight:"4px"}}>Vederi salvate</span>
      ${Object.entries(SAVED).map(([k,v])=>html`<button key=${k} className="chip" aria-pressed=${activeView===k} onClick=${()=>{setActiveView(k);setF({...EMPTY_F,...v.f});}}>${v.label}</button>`)}
      ${anyF&&html`<button className="chip" onClick=${()=>{setQ("");setF(EMPTY_F);setActiveView(null);}}><${Icon} n="x" s=${12}/>Șterge filtrele</button>`}
    </div>
    <${FG} k="zone" label="Zonă" opts=${ZONES}/>
    <${FG} k="prio" label="Prioritate" opts=${{A:"A · de sunat primii",B:"B · de verificat",C:"C · are site"}}/>
    <${FG} k="web" label="Status site" opts=${WEB}/>
    <${FG} k="stage" label="Etapă" opts=${Object.fromEntries(STAGES.map(s=>[s[0],s[1]]))}/>
    <${FG} k="type" label="Tip" opts=${TYPES}/>
    <div className="fgroup"><span className="lbl">Altele</span>
      <button className="chip" aria-pressed=${f.hasPhone} onClick=${()=>{setActiveView(null);setF(o=>({...o,hasPhone:!o.hasPhone}));}}>Are telefon</button>
      <button className="chip" aria-pressed=${f.stale} onClick=${()=>{setActiveView(null);setF(o=>({...o,stale:!o.stale}));}}>Ultima interacțiune > 14 zile</button>
      <button className="chip" aria-pressed=${f.mine} onClick=${()=>{setActiveView(null);setF(o=>({...o,mine:!o.mine}));}}>Responsabil: eu</button>
    </div>
  </div>
  <p className="count num">${list.length} ${list.length===1?"unitate":"unități"}</p>
  <div className="tablewrap"><table>
    <thead><tr><${Th} k="priority">Pr.<//><${Th} k="name">Unitate<//><${Th} k="zone">Zonă<//><th>Site</th><${Th} k="stage">Etapă<//><th>Telefon</th><${Th} k="rooms">Camere<//><${Th} k="last">Ultima interacțiune<//><th>Responsabil</th></tr></thead>
    <tbody>
      ${list.map(l=>{const t=last(l); return html`<tr key=${l.id} onClick=${()=>open(l.id)} tabIndex="0" onKeyDown=${e=>e.key==="Enter"&&open(l.id)}>
        <td><${Prio} p=${l.priority}/></td>
        <td><div className="nm">${l.name}${l.doNotContact&&html` <span className="web" style=${{background:"#D5675E22",color:"#F2A49D"}}>Nu mai contacta</span>`}</div><div className="sub">${TYPES[l.type]} · ${l.category}</div></td>
        <td>${ZONES[l.zone]}</td>
        <td><${Web} w=${l.web}/></td>
        <td><${StageBadge} s=${l.stage}/></td>
        <td className="num">${l.phone||html`<span className="muted">—</span>`}</td>
        <td className="num">${l.rooms}</td>
        <td>${t?html`<span className=${t<T0-14*DAY?"due late":""}>${rel(t)}</span>`:html`<span className="muted">niciodată</span>`}</td>
        <td><span className="row"><span className=${"avatar"+(l.owner===ME?" gold":"")} style=${{width:"22px",height:"22px",fontSize:"10px"}}>${USERS[l.owner].split(" ").map(x=>x[0]).join("")}</span></span></td>
      </tr>`;})}
    </tbody></table></div>
  <div className="cards">
    ${list.map(l=>html`<button key=${l.id} className="lcard" onClick=${()=>open(l.id)}>
      <div className="row" style=${{flexWrap:"nowrap"}}><${Prio} p=${l.priority}/><b style=${{flex:1,minWidth:0}}>${l.name}</b><${StageBadge} s=${l.stage}/></div>
      <div className="row muted" style=${{fontSize:"12px"}}>${ZONES[l.zone]} · ${TYPES[l.type]} · <${Web} w=${l.web}/></div>
    </button>`)}
  </div>`;
}

  const TABS=[["prezentare","Prezentare"],["contacte",`Contacte (${l.contacts.length})`],["istoric","Istoric"],["sarcini",`Sarcini (${l.tasks.filter(t=>!t.done).length})`],["oferta","Ofertă"]];

  <div className="scrim" onClick=${close}></div>

      <div className="quick">
        <a className="btn primary" href=${phone?"tel:"+phone.replace(/\s/g,""):undefined} disabled=${!phone}><${Icon} n="phone"/>Sună</a>
        <a className="btn" href=${phone?waLink(phone):undefined} target="_blank" rel="noopener" disabled=${!phone}><${Icon} n="msg"/>WhatsApp</a>
        <a className="btn" href=${l.email?"mailto:"+l.email:undefined} disabled=${!l.email}><${Icon} n="mail"/>Email</a>

      ${phone&&!dnc&&html`<div className="muted num" style=${{fontSize:"12px",marginTop:"-4px"}}>Telefon: <span style=${{color:"var(--text)",userSelect:"all"}}>${phone}</span>${primary?` · ${primary.name}, ${CROLE[primary.role].toLowerCase()}, preferă ${CPREF[primary.pref].toLowerCase()}`:""}</div>`}
      <div className="row">

        <span className="muted" style=${{fontSize:"12px"}}>Responsabil: ${USERS[l.owner]}</span>
      </div>
    </div>
    <div className="dbody">
      <div className="tabs" role="tablist">${TABS.map(([k,lb])=>html`<button key=${k} role="tab" aria-selected=${tab===k} onClick=${()=>setTab(k)}>${lb}</button>`)}</div>

function LeadHistory({l,upd,say}){
  const [type,setType]=useState("APEL"); const [out,setOut]=useState("DISCUTIE_POZITIVA"); const [notes,setNotes]=useState(""); const [next,setNext]=useState("");
  const items=[...l.interactions.map(i=>({...i,kind:"i"})),...l.history.map(h=>({...h,kind:"h"}))].sort((a,b)=>b.at-a.at);
  const save=()=>{
    upd(l.id,x=>{x.interactions=[{id:uid("i"),type,outcome:out,at:Date.now(),by:USERS[ME],notes:notes||"(fără notițe)"},...x.interactions];
      if(next){x.tasks=[...x.tasks,{id:uid("t"),title:(out==="CERE_OFERTA"?"Trimite oferta":"Revino")+" după "+ITYPE[type].toLowerCase(),due:at(+next,10),type:"APEL",done:false,assignee:ME}];}
      return x;});
    setNotes(""); setNext(""); say(next?"Interacțiune salvată și sarcină creată":"Interacțiune salvată");
  };
  return html`<div className="stack">
    ${!l.doNotContact&&html`<div className="panel stack" style=${{gap:"8px"}}>
      <h3>Notează o interacțiune</h3>

        <label>Rezultat<select id="i-out" className="select" value=${out} onChange=${e=>setOut(e.target.value)}>${Object.entries(OUTCOME).map(([k,v])=>html`<option key=${k} value=${k}>${v}</option>`)}</select></label>

      <div className="row"><label className="muted" htmlFor="i-next" style=${{fontSize:"12px"}}>Sarcină următoare</label>
        <select id="i-next" className="select" value=${next} onChange=${e=>setNext(e.target.value)}><option value="">fără</option><option value="1">mâine</option><option value="3">peste 3 zile</option><option value="7">peste o săptămână</option></select>
        <span style=${{flex:1}}></span><button className="btn primary sm" onClick=${save}>Salvează</button></div>
    </div>`}
    <div className="timeline">
      ${items.map(it=>it.kind==="i"?html`<div key=${it.id} className="tl"><span className="ic"><${Icon} n=${ITYPE_ICON[it.type]} s=${14}/></span><div style=${{minWidth:0}}>
          <div><b>${ITYPE[it.type]}</b>${it.outcome&&html`<span className="out">${OUTCOME[it.outcome]}</span>`}</div>
          <div className="when">${fmtDT(it.at)} · ${it.by}</div><div style=${{marginTop:"3px"}}>${it.notes}</div></div></div>`
        :html`<div key=${it.id} className="tl"><span className="ic stage"><${Icon} n="arrow" s=${14}/></span><div>

          <div className="when">${fmtDT(it.at)} · ${it.by}</div></div></div>`)}
    </div></div>`;
}

function LeadTasks({l,upd,say}){
  const [title,setTitle]=useState(""); const [days,setDays]=useState("1");
  const add=()=>{ if(!title.trim()) return; upd(l.id,x=>({...x,tasks:[...x.tasks,{id:uid("t"),title,due:at(+days,10),type:"APEL",done:false,assignee:ME}]})); setTitle(""); say("Sarcină adăugată"); };
  const tasks=[...l.tasks].sort((a,b)=>a.done-b.done||a.due-b.due);
  return html`<div className="stack">
    <div className="row"><input id="t-new" className="input" style=${{flex:1,minWidth:"180px"}} placeholder="ex. Sună din nou marți" value=${title} onInput=${e=>setTitle(e.target.value)} onKeyDown=${e=>e.key==="Enter"&&add()}/>
      <select id="t-days" className="select" value=${days} onChange=${e=>setDays(e.target.value)}><option value="0">azi</option><option value="1">mâine</option><option value="3">peste 3 zile</option><option value="7">peste o săptămână</option></select>

    <div className="tasklist">${tasks.length?tasks.map(t=>html`<div key=${t.id} className=${"task"+(t.done?" done":"")}>
      <input type="checkbox" id=${"lt-"+t.id} checked=${t.done} onChange=${()=>upd(l.id,x=>({...x,tasks:x.tasks.map(y=>y.id===t.id?{...y,done:!y.done}:y)}))} aria-label=${"Bifează: "+t.title}/>
      <div><div className="t">${t.title}</div><div className="l">${USERS[t.assignee]}</div></div>

  </div>`;
}

/* ---------------- Calculator de economii ---------------- */
function savings({revenue,bookingShare,commission,moved,setup,monthly}){
  const viaBooking = revenue*bookingShare/100;
  const saved = viaBooking*moved/100*commission/100;
  const cost1 = setup+12*monthly, costN=12*monthly;
  const perMonth = saved/12-monthly;
  return {viaBooking,saved,cost1,costN,net1:saved-cost1,netN:saved-costN,payback:perMonth>0?setup/perMonth:null,commissionTotal:viaBooking*commission/100};
}
function SavingsCalc({l,say}){
  const [v,setV]=useState({revenue:l.revenue,bookingShare:70,commission:15,moved:25,setup:2500,monthly:250});
  const r=savings(v);
  const F=({k,label,suf,step=1})=>html`<label>${label}<div className="row" style=${{flexWrap:"nowrap"}}><input id=${"calc-"+k} className="input num" type="number" step=${step} value=${v[k]} style=${{width:"100%"}} onInput=${e=>setV(o=>({...o,[k]:+e.target.value||0}))}/><span className="muted">${suf}</span></div></label>`;
  const max=Math.max(r.saved,r.cost1,1);
  return html`<div className="stack">
    <p className="muted" style=${{margin:0}}>Calculul pentru demo și pentru oferta PDF, pe cifrele unității. Booking rămâne vitrina. Mutăm pe direct doar o parte din rezervări.</p>
    <div className="calc">
      <${F} k="revenue" label="Încasări anuale estimate" suf="lei" step="1000"/>
      <${F} k="bookingShare" label="Cât vine azi prin Booking" suf="%"/>
      <${F} k="commission" label="Comision Booking" suf="%"/>
      <${F} k="moved" label="Rezervări mutate pe direct" suf="%"/>
      <${F} k="setup" label="Setup (o dată)" suf="lei" step="100"/>
      <${F} k="monthly" label="Abonament" suf="lei/lună" step="10"/>
      <div className="res">
        <div className="eyebrow">Comision Booking economisit pe an</div>
        <div className="big num">${lei(r.saved)}</div>
        <div className="muted" style=${{fontSize:"12px"}}>Azi plătesc ${lei(r.commissionTotal)} / an comision pe ${lei(r.viaBooking)} încasări prin Booking.</div>
        <div className="cmp"><span>Economie / an</span><div className="bar" style=${{width:(r.saved/max*100)+"%",background:"var(--gold)"}}></div><span className="num">${lei(r.saved)}</span></div>
        <div className="cmp"><span>Costul nostru, anul 1</span><div className="bar" style=${{width:(r.cost1/max*100)+"%",background:"var(--teal)"}}></div><span className="num">${lei(r.cost1)}</span></div>
        <div className="cmp"><span>Din anul 2</span><div className="bar" style=${{width:(r.costN/max*100)+"%",background:"#2B5577"}}></div><span className="num">${lei(r.costN)}</span></div>
        <div className="row" style=${{marginTop:"12px",gap:"18px"}}>
          <div><div className="eyebrow">Câștig net anul 1</div><b className="num" style=${{color:r.net1>=0?"var(--ok)":"var(--danger)"}}>${lei(r.net1)}</b></div>
          <div><div className="eyebrow">Din anul 2</div><b className="num" style=${{color:r.netN>=0?"var(--ok)":"var(--danger)"}}>${lei(r.netN)} / an</b></div>
          <div><div className="eyebrow">Setup recuperat în</div><b className="num">${r.payback?Math.ceil(r.payback)+" luni":"—"}</b></div>
        </div>
      </div>
    </div>
    <div className="row"><button className="btn gold" onClick=${()=>say("Generarea PDF a ofertei vine în Pasul 4")}><${Icon} n="coins"/>Generează oferta PDF</button><span className="muted" style=${{fontSize:"12px"}}>Șablon: Standard · valabilă 30 de zile</span></div>
  </div>`;
}

/* ---------------- Pipeline (Kanban) ---------------- */
function Pipeline({leads,open,requestMove}){
  const [over,setOver]=useState(null); const [drag,setDrag]=useState(null);
  const [mine,setMine]=useState(false);
  const shown = leads.filter(l=>!mine||l.owner===ME);
  return html`
  <div className="topbar"><h1>Pipeline</h1><span className="muted" style=${{fontSize:"13px"}}>Trage cardurile între coloane. Pe telefon, folosește „Mută în…”.</span><span className="sp"></span>
    <button className="chip" aria-pressed=${mine} onClick=${()=>setMine(m=>!m)}>Doar ale mele</button></div>
  <div className="board">
    ${STAGES.map(([k,label,color])=>{const items=shown.filter(l=>l.stage===k);
      const value = k==="CASTIGAT"?items.reduce((s,l)=>s+(l.client?.monthly||0),0):0;
      return html`<section key=${k} className=${"col"+(over===k?" over":"")} aria-label=${label}
        onDragOver=${e=>{e.preventDefault();setOver(k);}} onDragLeave=${()=>setOver(o=>o===k?null:o)}
        onDrop=${e=>{e.preventDefault();setOver(null);const id=e.dataTransfer.getData("text/plain");if(id)requestMove(id,k);}}>
        <div className="colh"><i className="dot" style=${{background:color}}></i><h3>${label}</h3><span className="n num">${items.length}${value?` · ${lei(value)}/lună`:""}</span></div>
        <div className="colb">
          ${items.map(l=>{const nt=l.tasks.filter(t=>!t.done).sort((a,b)=>a.due-b.due)[0];
            return html`<article key=${l.id} className=${"kcard"+(drag===l.id?" dragging":"")} draggable="true"
            onDragStart=${e=>{e.dataTransfer.setData("text/plain",l.id);setDrag(l.id);}} onDragEnd=${()=>setDrag(null)}>
            <div className="row" style=${{flexWrap:"nowrap"}}><${Prio} p=${l.priority}/><span className="nm" role="button" tabIndex="0" onClick=${()=>open(l.id)} onKeyDown=${e=>e.key==="Enter"&&open(l.id)}>${l.name}</span></div>
            <div className="meta">${ZONES[l.zone]} · ${l.rooms} cam. · <${Web} w=${l.web}/></div>
            ${nt&&html`<div className="meta" style=${{flexWrap:"nowrap",alignItems:"flex-start"}}><${Icon} n="cal" s=${12}/><span style=${{minWidth:0}} className=${startOfDay(nt.due)<T0?"due late":""}>${nt.title} · ${rel(nt.due)}</span></div>`}
            ${k==="PIERDUT"&&l.lostReason&&html`<div className="meta" style=${{color:"#F2A49D"}}>${LOST[l.lostReason]}</div>`}
            ${k==="REVINO_MAI_TARZIU"&&l.followUp&&html`<div className="meta">Revino ${fmtDate(l.followUp)}</div>`}
            <select className="select" aria-label=${"Mută "+l.name+" în"} value="" onChange=${e=>e.target.value&&requestMove(l.id,e.target.value)}>
              <option value="">Mută în…</option>${STAGES.filter(s=>s[0]!==k).map(s=>html`<option key=${s[0]} value=${s[0]}>${s[1]}</option>`)}
            </select>
          </article>`;})}
        </div></section>`;})}
  </div>`;
}

  return html`<div className="modal" role="dialog" aria-modal="true" aria-labelledby="sd-t"><div className="box">
    <h2 id="sd-t">${lead.name} → ${STAGE[ask.to].label}</h2>
    ${ask.to==="PIERDUT"&&html`<label className="stack" style=${{gap:"4px"}}><span className="muted" style=${{fontSize:"12px"}}>Motiv</span><select id="sd-reason" className="select" value=${reason} onChange=${e=>setReason(e.target.value)}>${Object.entries(LOST).map(([k,v])=>html`<option key=${k} value=${k}>${v}</option>`)}</select></label>`}
    ${ask.to==="REVINO_MAI_TARZIU"&&html`<label className="stack" style=${{gap:"4px"}}><span className="muted" style=${{fontSize:"12px"}}>Revino peste</span><select id="sd-days" className="select" value=${days} onChange=${e=>setDays(+e.target.value)}><option value="14">2 săptămâni</option><option value="30">o lună</option><option value="90">3 luni</option><option value="120">4 luni (înainte de sezon)</option></select><span className="muted" style=${{fontSize:"12px"}}>Se creează automat o sarcină pe ${fmtDate(at(days))}.</span></label>`}
    ${ask.to==="CASTIGAT"&&html`<div className="form-grid">
      <label>Plan<select id="sd-plan" className="select" value=${plan} onChange=${e=>setPlan(e.target.value)}><option>Esențial</option><option>Standard</option><option>Premium</option></select></label>
      <label>Setup (lei)<input id="sd-setup" className="input num" type="number" value=${setup} onInput=${e=>setSetup(e.target.value)}/></label>
      <label>Abonament (lei/lună)<input id="sd-monthly" className="input num" type="number" value=${monthly} onInput=${e=>setMonthly(e.target.value)}/></label>
    </div><p className="muted" style=${{margin:0,fontSize:"12px"}}>Se creează fișa de client, abonamentul și prima plată.</p>`}
    <textarea id="sd-note" className="input" rows="2" placeholder="Notă (opțional)" value=${note} onInput=${e=>setNote(e.target.value)}></textarea>
    <div className="row" style=${{justifyContent:"flex-end"}}><button className="btn ghost" onClick=${cancel}>Renunță</button>
      <button className="btn primary" onClick=${()=>confirm({lostReason:reason,followUp:at(days),note,plan,setup,monthly})}>Mută</button></div>
  </div></div>`;
}

const COAST=[[44.36,28.648],[44.33,28.641],[44.31,28.636],[44.29,28.633],[44.27,28.631],[44.25,28.632],[44.235,28.635],[44.22,28.639],[44.205,28.644],[44.19,28.651],[44.18,28.656],[44.172,28.662],[44.166,28.666],[44.158,28.664],[44.15,28.668],[44.14,28.672],[44.13,28.668],[44.115,28.662],[44.1,28.655],[44.085,28.651],[44.07,28.645],[44.058,28.644],[44.045,28.645],[44.03,28.65],[44.01,28.654],[43.99,28.656]];
const VIEWS={tot:{label:"Tot litoralul",lat:[43.995,44.33],lon:[28.56,28.71]},nord:{label:"Mamaia și Năvodari",lat:[44.195,44.33],lon:[28.58,28.68]},cta:{label:"Constanța",lat:[44.155,44.205],lon:[28.615,28.68]},sud:{label:"Agigea și Eforie",lat:[44.015,44.1],lon:[28.6,28.67]}};
function MapView({leads,open}){
  const [vk,setVk]=useState("nord"); const [sel,setSel]=useState(null); const [zoneF,setZoneF]=useState("");
  const V=VIEWS[vk]; const k=Math.cos(44.15*Math.PI/180);
  const W=1000, H=Math.round(W*(V.lat[1]-V.lat[0])/((V.lon[1]-V.lon[0])*k));
  const px=(lat,lon)=>[(lon-V.lon[0])/(V.lon[1]-V.lon[0])*W,(V.lat[1]-lat)/(V.lat[1]-V.lat[0])*H];
  const sea="M"+COAST.map(([a,b])=>px(a,b).join(",")).join(" L")+` L${W+6000},${H+6000} L${W+6000},-6000 Z`;
  const ell=(lat,lon,rl,ro)=>{const [cx,cy]=px(lat,lon); return {cx,cy,rx:ro/(V.lon[1]-V.lon[0])*W,ry:rl/(V.lat[1]-V.lat[0])*H};};
  const shown=leads.filter(l=>!zoneF||l.zone===zoneF);
  const sc=Math.max(1,H/900); const r=8*sc;
  const s=leads.find(l=>l.id===sel);
  const labels=[["Năvodari",44.33,28.61],["Mamaia",44.24,28.645],["Lacul Siutghiol",44.24,28.598],["Constanța",44.18,28.625],["Agigea",44.09,28.625],["Lacul Techirghiol",44.05,28.592],["Eforie Nord",44.064,28.655],["Eforie Sud",44.025,28.662],["Marea Neagră",44.13,28.695]];
  return html`
  <div className="topbar"><h1>Hartă</h1><span className="sp"></span>
    <select id="map-zone" className="select" value=${zoneF} onChange=${e=>setZoneF(e.target.value)} aria-label="Filtrează după zonă"><option value="">Toate zonele</option>${Object.entries(ZONES).map(([k2,v])=>html`<option key=${k2} value=${k2}>${v}</option>`)}</select></div>
  <div className="mapwrap">
    <div className="map">
      <svg viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet" role="img" aria-label="Harta unităților de cazare de pe litoral">
        <rect x="-6000" y="-6000" width=${W+12000} height=${H+12000} fill="#10263A"/>
        <path d=${sea} fill="#0B3B4A"/>
        <path d=${"M"+COAST.map(([a,b])=>px(a,b).join(",")).join(" L")} fill="none" stroke="#BFA18155" stroke-width=${2*sc}/>
        <ellipse ...${ell(44.245,28.6,0.04,0.022)} fill="#0E3445"/>
        <ellipse ...${ell(44.05,28.6,0.012,0.032)} fill="#0E3445"/>
        ${labels.map(([t,a,b])=>{const [x,y]=px(a,b); return html`<text key=${t} x=${x} y=${y} font-size=${13*sc} text-anchor="middle" style=${{fill:t.startsWith("Marea")||t.startsWith("Lacul")?"#4C8C9C":"#8EA2B6"}} opacity=".8">${t}</text>`;})}
        ${shown.map(l=>{const [x,y]=px(l.lat,l.lon); const on=sel===l.id; return html`<g key=${l.id} className="pin" onClick=${()=>setSel(l.id)} tabIndex="0" onKeyDown=${e=>e.key==="Enter"&&setSel(l.id)} role="button" aria-label=${l.name}>
          <circle cx=${x} cy=${y} r=${on?r*1.6:r} fill=${STAGE[l.stage].color} stroke=${on?"#fff":"#0A1828"} stroke-width=${(on?3:2)*sc}/>
          ${l.priority==="A"&&html`<circle cx=${x} cy=${y} r=${r/2.6} fill="#0A1828"/>`}
          <title>${l.name} · ${STAGE[l.stage].label}</title></g>`;})}
      </svg>
      <div className="mapctl">${Object.entries(VIEWS).map(([k2,v])=>html`<button key=${k2} className="chip" style=${{background:vk===k2?"#178582":"#0A1828cc",color:"var(--text)"}} aria-pressed=${vk===k2} onClick=${()=>setVk(k2)}>${v.label}</button>`)}</div>
      <div className="mapnote">Contur aproximativ pentru prototip. În aplicație: Leaflet + OpenStreetMap, cu străzi și zoom. Punctul din mijloc marchează prioritatea A.</div>
    </div>
    <div className="mapside">
      ${s?html`<div className="panel stack" style=${{gap:"8px"}}>
        <div className="row" style=${{flexWrap:"nowrap"}}><${Prio} p=${s.priority}/><b style=${{flex:1}}>${s.name}</b><button className="btn ghost sm" onClick=${()=>setSel(null)} aria-label="Închide"><${Icon} n="x" s=${14}/></button></div>
        <div className="muted" style=${{fontSize:"13px"}}>${s.address}, ${ZONES[s.zone]}</div>
        <div className="row"><${StageBadge} s=${s.stage}/><${Web} w=${s.web}/></div>
        <div className="row"><button className="btn primary sm" onClick=${()=>open(s.id)}>Deschide fișa</button><a className="btn sm" href=${mapsLink(s)} target="_blank" rel="noopener"><${Icon} n="pin" s=${14}/>Navighează</a></div>
      </div>`:html`<div className="panel muted" style=${{fontSize:"13px"}}>Apasă pe un punct ca să vezi unitatea. Culoarea arată etapa din pipeline.</div>`}
      <div className="panel"><h3 style=${{marginBottom:"8px"}}>Legendă</h3><div className="stack" style=${{gap:"6px"}}>
        ${STAGES.map(([k2,lb,c])=>html`<span key=${k2} className="badge" style=${{fontWeight:500}}><i className="dot" style=${{background:c}}></i>${lb}<span className="muted num" style=${{marginLeft:"auto"}}>${shown.filter(l=>l.stage===k2).length}</span></span>`)}
      </div></div>
    </div>
  </div>`;
}

/* ---------------- Clienți ---------------- */
const IMPL={site:"Site",motor:"Motor rezervări",ical:"iCal",plati:"Plăți"};
const IMPLS={NEINCEPUT:"neînceput",IN_LUCRU:"în lucru",GATA:"gata"};
function Clients({leads,open,upd,say}){
  const cl=leads.filter(l=>l.client);
  const mrr=cl.reduce((s,l)=>s+l.client.monthly,0);
  const unpaid=cl.reduce((s,l)=>s+l.client.payments.filter(p=>p.status==="NEPLATIT").length*l.client.monthly,0);
  const month=m=>{const d=new Date(T0);d.setDate(1);d.setMonth(d.getMonth()+m);return d.toLocaleDateString("ro-RO",{month:"short",year:"2-digit"});};
  const cycle=v=>({NEINCEPUT:"IN_LUCRU",IN_LUCRU:"GATA",GATA:"NEINCEPUT"})[v];
  return html`
  <div className="topbar"><h1>Clienți</h1><span className="sp"></span><span className="muted num">MRR <b style=${{color:"var(--gold-hi)"}}>${lei(mrr)}</b> · restanțe <b style=${{color:unpaid?"var(--danger)":"var(--ok)"}}>${lei(unpaid)}</b></span></div>
  <div className="clients">
    ${cl.map(l=>{const c=l.client; return html`<article key=${l.id} className="panel stack">
      <div><button className="btn ghost" style=${{padding:0,border:0,fontFamily:"var(--f-display)",fontSize:"16px",fontWeight:700}} onClick=${()=>open(l.id)}>${l.name}</button><div className="muted" style=${{fontSize:"12px"}}>${ZONES[l.zone]} · client din ${new Date(c.start).toLocaleDateString("ro-RO",{day:"numeric",month:"long"})}</div></div>
      <dl className="kv" style=${{gridTemplateColumns:"110px minmax(0,1fr)"}}>
        <dt>Plan</dt><dd>${c.plan}</dd>
        <dt>Setup</dt><dd className="num">${lei(c.setup)}</dd>
        <dt>Abonament</dt><dd className="num" style=${{color:"var(--gold-hi)"}}>${lei(c.monthly)} / lună</dd>
        <dt>Domeniu</dt><dd>${c.domain||html`<span className="muted">de stabilit</span>`}</dd>
        <dt>tenantSlug</dt><dd><code>${c.tenantSlug}</code></dd>
      </dl>
      <div><div className="eyebrow" style=${{marginBottom:"6px"}}>Implementare · apasă ca să schimbi</div><div className="impl">${Object.entries(IMPL).map(([k,lb])=>html`<div key=${k} className=${c.impl[k]} role="button" tabIndex="0" style=${{cursor:"pointer"}} onClick=${()=>upd(l.id,x=>({...x,client:{...x.client,impl:{...x.client.impl,[k]:cycle(x.client.impl[k])}}}))}>${lb}<br/><b>${IMPLS[c.impl[k]]}</b></div>`)}</div></div>
      <div><div className="eyebrow" style=${{marginBottom:"6px"}}>Abonament lunar</div><div className="months">${c.payments.map((p,i)=>html`<button key=${i} className=${p.status} onClick=${()=>{upd(l.id,x=>({...x,client:{...x.client,payments:x.client.payments.map((q,j)=>j===i?{...q,status:q.status==="PLATIT"?"NEPLATIT":"PLATIT"}:q)}}));say("Încasare actualizată");}}>${month(p.m)} · ${p.status==="PLATIT"?"plătit":"neplătit"}</button>`)}</div></div>
    </article>`;})}
    ${cl.length===0&&html`<p className="muted">Încă niciun client. Mută un lead în „Câștigat” ca să apară aici.</p>`}
  </div>`;
}
